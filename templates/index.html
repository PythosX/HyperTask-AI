<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperTask AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background: radial-gradient(circle at top left, #0d0614, #150a21, #08030c);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 30px rgba(121, 40, 202, 0.3);
            border-radius: 20px;
            padding: 30px;
        }
        h2 { text-align: center; margin-bottom: 20px; background: linear-gradient(135deg, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #a1a1aa; }
        input {
            width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px; color: #fff; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #a855f7; box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }
        button {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #7928ca, #ff0080); border: none;
            border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        button:hover { opacity: 0.9; box-shadow: 0 0 15px rgba(255, 0, 128, 0.5); }
        .toggle-link { text-align: center; margin-top: 15px; font-size: 0.85rem; color: #a855f7; cursor: pointer; }
        .hidden { display: none; }
        .alert { padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.85rem; text-align: center; display: none; }
        .alert.error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
        .alert.success { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #86efac; }
        .task-card { background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #a855f7; display: flex; justify-content: space-between; align-items: center; }
        .task-card.sent { border-left-color: #22c55e; opacity: 0.6; }
    </style>
</head>
<body>

<div class="container">
    <div id="alert-box" class="alert"></div>

    <!-- AUTH SECTION -->
    <div id="auth-section">
        <h2 id="auth-title">Login</h2>
        <form id="auth-form">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <div class="input-group hidden" id="telegram-group">
                <label>Telegram Chat ID</label>
                <input type="text" id="telegram_id" placeholder="Get from @userinfobot">
            </div>
            <button type="submit" id="auth-btn">Login</button>
        </form>
        <div class="toggle-link" id="toggle-btn" onclick="toggleAuthMode()">Don't have an account? Sign up</div>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboard-section" class="hidden">
        <h2>HyperTask AI</h2>
        <p style="text-align: center; margin-bottom: 15px;" id="welcome-msg"></p>
        
        <div class="input-group">
            <label>Reminder Title</label>
            <input type="text" id="task-title" placeholder="Study Python Flask">
        </div>
        <div class="input-group">
            <label>Date & Time</label>
            <input type="datetime-local" id="task-time">
        </div>
        <button type="button" onclick="addSchedule()">Set Reminder</button>
        <button type="button" onclick="logout()" style="background: #334155; margin-top: 8px;">Logout</button>

        <h3 style="margin-top: 25px; font-size: 1rem;">Your Active Schedules</h3>
        <div id="tasks-list"></div>
    </div>
</div>

<script>

    // Helper to convert 24-hour format (2026-08-08 14:19) to 12-hour format (2026-08-08 02:19 PM)
function formatTo12Hour(dateTimeStr) {
    if (!dateTimeStr) return '';
    
    // Normalize format
    const cleanStr = dateTimeStr.replace('T', ' ');
    const [datePart, timePart] = cleanStr.split(' ');
    
    if (!timePart) return dateTimeStr;
    
    let [hours, minutes] = timePart.split(':');
    hours = parseInt(hours, 10);
    
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12; // convert '0' to '12'
    
    const strHours = hours < 10 ? '0' + hours : hours;
    
    return `${datePart} ${strHours}:${minutes} ${ampm}`;
    }
    
    let isSignUp = false;

    function showAlert(msg, type = 'error') {
        const box = document.getElementById('alert-box');
        box.innerText = msg;
        box.className = `alert ${type}`;
        box.style.display = 'block';
        setTimeout(() => { box.style.display = 'none'; }, 4000);
    }

    function toggleAuthMode() {
        isSignUp = !isSignUp;
        document.getElementById('auth-title').innerText = isSignUp ? "Sign Up" : "Login";
        document.getElementById('auth-btn').innerText = isSignUp ? "Sign Up" : "Login";
        document.getElementById('telegram-group').classList.toggle('hidden', !isSignUp);
        document.getElementById('telegram_id').required = isSignUp;
        document.getElementById('toggle-btn').innerText = isSignUp ? "Already have an account? Login" : "Don't have an account? Sign up";
    }

    document.getElementById('auth-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const telegram_id = document.getElementById('telegram_id').value.trim();

        const endpoint = isSignUp ? '/api/signup' : '/api/login';
        const payload = isSignUp ? { username, password, telegram_id } : { username, password };

        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (res.ok && data.success) {
                if (isSignUp) {
                    showAlert("Account created! Please log in now.", "success");
                    toggleAuthMode();
                } else {
                    showDashboard(data.username);
                }
            } else {
                showAlert(data.message || "Authentication failed!");
            }
        } catch (err) {
            showAlert("Network error. Check server connectivity.");
        }
    });

    function showDashboard(username) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        document.getElementById('welcome-msg').innerText = `Welcome, ${username}!`;
        loadSchedules();
    }

    async function addSchedule() {
        const title = document.getElementById('task-title').value;
        const remind_at = document.getElementById('task-time').value;

        if (!title || !remind_at) return showAlert("Fill all fields!");

        const res = await fetch('/api/schedules', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, remind_at })
        });

        if (res.ok) {
            document.getElementById('task-title').value = '';
            loadSchedules();
        }
    }

    async function loadSchedules() {
        const res = await fetch('/api/schedules');
        const data = await res.json();
        const list = document.getElementById('tasks-list');
        list.innerHTML = '';

        if (data.schedules) {
            data.schedules.forEach(task => {
                const div = document.createElement('div');
                div.className = `task-card ${task.is_sent ? 'sent' : ''}`;
                div.innerHTML = `
                    <div>
                        <strong>${task.title}</strong><br>
                        <small>${task.remind_at.replace('T', ' ')}</small>
                    </div>
                    <span>${task.is_sent ? '✓ Sent' : '⏳ Pending'}</span>
                `;
                list.appendChild(div);
            });
        }
    }

    async function logout() {
        await fetch('/api/logout', { method: 'POST' });
        location.reload();
    }
    document.getElementById('auth-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const telegram_id = document.getElementById('telegram_id').value.trim();

    const endpoint = isSignUp ? '/api/signup' : '/api/login';
    const payload = isSignUp ? { username, password, telegram_id } : { username, password };

    try {
        const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await res.json();
        console.log("Response:", data); // Check browser console (F12 or Inspect)

        if (res.ok && data.success) {
            alert(isSignUp ? "Account created successfully! Please login." : "Logged in!");
            if (isSignUp) toggleAuthMode();
            else showDashboard(data.username);
        } else {
            alert(data.message || "Signup failed!");
        }
    } catch (err) {
        console.error("Fetch Error:", err);
        alert("Server error. Check your Render logs!");
    }
});
    
</script>
</body>
</html>
